spring.application.name=dns-ip-manager
server.port=8080
server.servlet.context-path=/dns-ip-manager
server.servlet.session.timeout=30m

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dns_ip_manager}
spring.datasource.username=${DB_USER:dnsadmin}
spring.datasource.password=${DB_PASSWORD:dnsadmin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
